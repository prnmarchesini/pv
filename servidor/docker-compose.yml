# Localhost: Postgres + serviço, como vai ficar no Coolify.
#   docker compose up -d --build
# O plugin só usa este serviço com a variável de ambiente
# CLIVUS_SERVICO=http://localhost:8765 definida antes de abrir o Civil 3D;
# sem ela, desde o 38.8, ele vai ao servidor do Clivus (produção).
services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clivus
      POSTGRES_USER: clivus
      POSTGRES_PASSWORD: clivus
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clivus -d clivus"]
      interval: 2s
      retries: 20

  servico:
    build: .
    environment:
      DATABASE_URL: postgresql://clivus:clivus@banco:5432/clivus
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped

volumes:
  banco:
